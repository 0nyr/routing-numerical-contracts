[project]
name = "routing-numerical-contracts"
version = "0.1.0"
description = "Reproducible comparisons of numerical contracts for routing evaluation"
readme = "README.md"
license = "MIT"
authors = [{name = "Florian Rascoussier"}]
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "numpy>=2", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncci"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.scripts]
routing-contracts = "ncci.study:main"
